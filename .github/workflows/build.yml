name: Build Mac app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build app and DMG
        run: ./scripts/build_dmg.sh "${GITHUB_REF_NAME}"

      - name: Smoke test (mount DMG and launch app)
        run: ./scripts/smoke_test.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Teleprompter-dmg
          path: dist/Teleprompter.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Teleprompter.dmg --clobber
          else
            gh release create "$TAG" dist/Teleprompter.dmg \
              --title "Teleprompter ${TAG#v}" \
              --notes-file .github/release-notes.md
          fi
